name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build design tokens
        run: pnpm --filter @repo/tokens build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Build
        run: pnpm build

  components:
    name: Component checks (a11y & interaction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build design tokens
        run: pnpm --filter @repo/tokens build

      - name: Build Storybook
        run: pnpm --filter @repo/ui build-storybook

      # Serves the static Storybook build and runs @storybook/test-runner:
      # axe-core accessibility assertions (a11y: test: "error") plus
      # play-function interaction tests for every story.
      - name: Run Storybook test suite
        working-directory: packages/ui
        run: >
          pnpm exec concurrently -k -s first -n "SB,TEST"
          "pnpm exec http-server storybook-static -p 6006 --silent"
          "pnpm exec wait-on tcp:6006 && pnpm exec test-storybook --maxWorkers=2"

      # Visual regression: enable after adding the CHROMATIC_PROJECT_TOKEN
      # secret and running `chromatic --exit-zero-on-changes` here, or via the
      # Chromatic GitHub App (see docs/ui-foundation.md).
